name: Deploy PlayTools to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'PlayTools.html'
      - 'tools/rig-inapp.bundle.js'
      - 'assets/rig/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Uploads the app plus the 3D battlestation viewer bundle + assets, preserving
      # the repo-relative paths under the deploy root (so the app's ./tools and
      # ../assets relative URLs resolve in production). The 3D bundle is
      # self-contained (three.js inlined); models are meshopt+WebP compressed.
      - name: Upload via FTP
        run: |
          set -e
          BASE="ftp://ftp.playologyentertainment.com/experiments/PlayTools"
          AUTH="${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"
          up() {
            echo "↑ $1"
            curl -fsS --ftp-create-dirs --retry 3 --max-time 180 --connect-timeout 15 \
              --user "$AUTH" -T "$1" "$BASE/$1"
          }
          up PlayTools.html
          up tools/rig-inapp.bundle.js
          up assets/rig/rig_manifest.json
          for f in assets/rig/models/*; do up "$f"; done
          for f in assets/rig/textures/*.jpg; do up "$f"; done
