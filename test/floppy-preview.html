<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#070912;color:#e8ecff;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
  .wrap{padding:36px 40px;}
  h1{font-size:18px;font-weight:600;margin:0 0 4px;letter-spacing:.04em;}
  .sub{font-size:13px;color:#8b93b8;margin:0 0 28px;}
  .row{display:flex;align-items:flex-end;gap:42px;margin-bottom:34px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .lbl{font-size:11px;color:#8b93b8;}
  /* the floppy icon is a 1em inline SVG, so font-size drives its size */
  .s-256{font-size:256px;line-height:1;}
  .s-64{font-size:64px;line-height:1;}
  .s-32{font-size:32px;line-height:1;}
  .s-26{font-size:26px;line-height:1;}
  /* mimic the cabinet tile so you can judge it in context */
  .cab{width:150px;background:#0d1022;border:1px solid #1d2444;border-radius:14px;
    padding:16px 14px;text-align:center;}
  .cab .ico{font-size:26px;line-height:1;margin-bottom:8px;}
  .cab .nm{font-size:14px;font-weight:600;}
  .cab .dna{font-size:11px;color:#8b93b8;margin-top:4px;}
  svg.floppy{display:inline-block;vertical-align:middle;height:1em;width:1em;}
  .compare{display:flex;gap:20px;align-items:center;font-size:48px;}
  .compare .old{filter:grayscale(.1);}
</style></head><body><div class="wrap">
  <h1>Defrag icon — floppy disk (proposal)</h1>
  <p class="sub">cyberpunk neon house style · inline SVG · scales to any size</p>

  <div class="row">
    <div class="cell"><div class="s-256" id="big"></div><div class="lbl">hero</div></div>
    <div class="cell"><div class="s-64" id="m64"></div><div class="lbl">64px</div></div>
    <div class="cell"><div class="s-32" id="m32"></div><div class="lbl">32px</div></div>
    <div class="cell"><div class="s-26" id="m26"></div><div class="lbl">26px (rail)</div></div>
  </div>

  <div class="row">
    <div class="cab"><div class="ico" id="cabico"></div><div class="nm">Defrag</div>
      <div class="dna">Focus +12 · Speed +8</div></div>
    <div class="cell">
      <div class="compare"><span class="old">💎</span><span style="color:#4a5278">→</span>
        <span id="cmp"></span></div>
      <div class="lbl">old 💎  →  new floppy</div>
    </div>
  </div>
</div>
<script>
// DEFRAG_ICON — 3.5" floppy disk in the PlayTools neon house style
// (teal body, dark #070912 outline, metal shutter, data-shard label).
const DEFRAG_ICON =
 '<svg class="floppy" viewBox="0 0 100 100" aria-hidden="true" focusable="false">'+
   // body — rounded square with the classic chamfered top-right corner
   '<path d="M24 9 H64 L91 33 V83 Q91 91 83 91 H24 Q16 91 16 83 V17 Q16 9 24 9 Z" '+
     'fill="#16f2c8" stroke="#070912" stroke-width="3" stroke-linejoin="round"/>'+
   // metal shutter across the top, with the chamfer notch on its right
   '<path d="M40 11 H64 L82 27 V41 H40 Z" fill="#aeb8d6" stroke="#070912" '+
     'stroke-width="3" stroke-linejoin="round"/>'+
   // shutter slider window (the dark slot)
   '<rect x="46" y="17" width="9" height="18" rx="2" fill="#070912"/>'+
   // write-protect tab corner, lower-left
   '<rect x="20" y="78" width="8" height="9" fill="#0c1330" stroke="#070912" stroke-width="2"/>'+
   // label panel — light card on the lower body
   '<rect x="24" y="49" width="52" height="36" rx="4" fill="#f4f6ff" '+
     'stroke="#070912" stroke-width="3"/>'+
   // label header strip (purple) + two handwriting lines (teal/pink) — a nod to
   // the Defrag data-shard palette
   '<rect x="28" y="53" width="44" height="7" rx="2" fill="#7c5cff"/>'+
   '<rect x="28" y="66" width="44" height="4" rx="2" fill="#16c8b4"/>'+
   '<rect x="28" y="74" width="30" height="4" rx="2" fill="#ff3df0"/>'+
 '</svg>';
for(const id of ['big','m64','m32','m26','cabico','cmp'])
  document.getElementById(id).innerHTML = DEFRAG_ICON;
</script>
</body></html>
