<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayTools — The Digital Arcade | Playology Entertainment</title>
<!--
  ============================================================
  PLAYTOOLS — The Digital Arcade
  Playology Entertainment · Single standalone HTML application
  ============================================================
  This is the APPLICATION (not the design document).
  Build footprint: Foundation (DD §10 build order, steps 1-4)
    1. SPA shell + hash routing + GamerDNA state + status strip + CRT theme
    2. Gamer DNA hub (profile editor, attribute radar, rank/class display)
    3. Reflex Lab MVP cabinets (Calibration -> Reaction -> CPS -> Precision)
    4. Share Card + Achievement engines (shared services)
  Zero external dependencies. All logic client-side. Persists to localStorage.
  ============================================================
-->
<style>
  /* ============================================================
     THEME TOKENS (Playology retro-arcade / CRT)
     ============================================================ */
  :root{
    --bg:#070912;
    --bg-2:#0c1024;
    --panel:#101736;
    --panel-2:#0a0e22;
    --ink:#e8ecff;
    --ink-dim:#9aa3d4;
    --neon:#16f2c8;      /* primary accent — overridden by user persona color */
    --neon-2:#ff3df0;    /* magenta */
    --neon-3:#ffd23d;    /* arcade gold */
    --neon-4:#7c5cff;    /* violet */
    --neon-5:#37e35b;    /* go-green */
    --danger:#ff4d6d;
    --grid:rgba(124,92,255,0.10);
    --line:rgba(124,92,255,0.30);
    --shadow:0 0 0 2px rgba(22,242,200,0.18), 0 0 24px rgba(22,242,200,0.10);
    --mono:"DejaVu Sans Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    --pixel:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(124,92,255,0.18), transparent 60%),
      radial-gradient(900px 500px at 90% 10%, rgba(255,61,240,0.10), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    color:var(--ink);
    font-family:var(--mono);
    font-size:15px;
    line-height:1.6;
    letter-spacing:0.2px;
    min-height:100vh;
  }
  a{color:var(--neon); text-decoration:none;}

  /* ---- CRT scanline + vignette overlay ---- */
  .crt-overlay{
    position:fixed; inset:0; pointer-events:none; z-index:9999;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:multiply; opacity:0.7;
  }
  .crt-overlay::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(120% 120% at 50% 50%, transparent 60%, rgba(0,0,0,0.45) 100%);
  }
  body.no-crt .crt-overlay{display:none;}
  body.no-crt .logo, body.no-crt .screen{ text-shadow:none; }

  /* ============================================================
     LAYOUT FRAME
     ============================================================ */
  .frame{max-width:1180px; margin:0 auto; padding:0 18px 90px;}

  header.marquee{ position:relative; text-align:center; padding:30px 12px 14px; }
  .brand-kicker{
    font-size:11px; letter-spacing:6px; text-transform:uppercase;
    color:var(--neon-3); text-shadow:0 0 10px rgba(255,210,61,0.6);
  }
  .logo{
    font-family:var(--pixel); font-weight:800; font-size:clamp(34px,7vw,64px);
    margin:6px 0 2px; letter-spacing:2px; line-height:1; color:#fff; cursor:pointer;
    text-shadow:0 0 8px var(--neon),0 0 22px rgba(22,242,200,0.7),3px 3px 0 var(--neon-2),6px 6px 0 rgba(255,61,240,0.4);
  }
  .logo .play{color:var(--neon);}
  .logo .tools{color:var(--neon-2);}
  .subtitle{ font-size:12px; color:var(--ink-dim); letter-spacing:3px; text-transform:uppercase; }

  /* ---- Status strip (sticky) ---- */
  .controls{
    position:sticky; top:0; z-index:50;
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    padding:10px 14px; margin:16px 0 22px;
    background:rgba(10,14,34,0.92); border:1px solid var(--line); border-radius:4px;
    backdrop-filter:blur(6px); box-shadow:var(--shadow);
  }
  .score-strip{font-size:12px; color:var(--ink-dim); letter-spacing:1px;}
  .score-strip b{color:var(--neon); font-family:var(--pixel);}
  .score-strip .sep{opacity:0.4; margin:0 4px;}
  .controls-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{
    font-family:var(--mono); font-size:12px; letter-spacing:1px; cursor:pointer;
    color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:3px;
    padding:7px 12px; text-transform:uppercase; transition:.15s;
  }
  .btn:hover{border-color:var(--neon); color:var(--neon); box-shadow:0 0 12px rgba(22,242,200,0.25);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn.primary{background:var(--neon); color:#04120a; border-color:var(--neon); font-weight:700;}
  .btn.primary:hover{box-shadow:0 0 16px rgba(22,242,200,0.5); color:#04120a;}
  .btn.ghost{background:transparent;}
  .btn.danger:hover{border-color:var(--danger); color:var(--danger); box-shadow:0 0 12px rgba(255,77,109,0.25);}

  /* ============================================================
     APP LAYOUT (rail + screen)
     ============================================================ */
  .layout{display:grid; grid-template-columns:230px 1fr; gap:20px; align-items:start;}
  nav.rail{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:14px 12px; position:sticky; top:70px;
  }
  nav.rail h3{
    font-family:var(--pixel); font-size:11px; letter-spacing:3px; text-transform:uppercase;
    color:var(--neon-3); margin:14px 8px 6px;
  }
  nav.rail h3:first-child{margin-top:2px;}
  nav.rail a{
    display:flex; align-items:center; gap:8px; justify-content:space-between;
    color:var(--ink-dim); padding:7px 10px; border-radius:4px; font-size:13px;
    border:1px solid transparent; transition:.12s;
  }
  nav.rail a:hover{color:var(--neon); background:rgba(22,242,200,0.06); border-color:var(--line);}
  nav.rail a.active{color:var(--neon); background:rgba(22,242,200,0.10); border-color:var(--line);}
  nav.rail a.locked{opacity:0.5; cursor:not-allowed;}
  nav.rail a.locked:hover{color:var(--ink-dim); background:transparent; border-color:transparent;}
  .mini-tag{font-size:9px; letter-spacing:1px; padding:1px 5px; border-radius:3px; text-transform:uppercase;}
  .mini-tag.soon{background:#2a3160; color:var(--ink-dim);}
  .mini-tag.mvp{background:var(--neon-5); color:#04120a;}

  main.screen{ min-height:480px; position:relative; }

  /* ---- Generic section/panel styling ---- */
  .panel{
    background:linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--line); border-radius:8px; padding:24px 26px; margin:0 0 22px;
    box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 14px 40px rgba(0,0,0,0.35);
    position:relative; overflow:hidden;
  }
  .panel::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:34px 34px; opacity:0.5;
  }
  .panel > *{position:relative;}
  body.no-crt .panel::before{display:none;}

  .view-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
  h1.title{font-family:var(--pixel); font-weight:800; font-size:24px; color:#fff; margin:0; letter-spacing:1px;}
  .lab-tag{font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--neon-2);}
  .view-desc{color:var(--ink-dim); margin:4px 0 18px; max-width:680px;}
  h2.sub{
    font-family:var(--pixel); font-size:16px; color:var(--neon); margin:22px 0 8px;
    letter-spacing:1px; border-left:3px solid var(--neon); padding-left:10px;
  }
  .muted{color:var(--ink-dim);}
  strong{color:#fff;}
  code{font-family:var(--mono); background:rgba(124,92,255,0.16); color:var(--neon); padding:1px 6px; border-radius:3px; font-size:13px;}

  /* ---- Cabinet grid (home/lobby) ---- */
  .cab-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin:16px 0;}
  .cab{
    display:block; background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
    padding:16px; transition:.15s; position:relative; color:inherit; cursor:pointer;
  }
  .cab:hover{border-color:var(--neon); box-shadow:0 0 16px rgba(22,242,200,0.18); transform:translateY(-2px);}
  .cab.locked{opacity:0.55; cursor:not-allowed;}
  .cab.locked:hover{border-color:var(--line); box-shadow:none; transform:none;}
  .cab .cab-icon{font-size:26px; line-height:1; margin-bottom:8px;}
  .cab .cab-name{font-family:var(--pixel); color:#fff; font-size:15px; letter-spacing:.5px; display:flex; gap:6px; align-items:center;}
  .cab .cab-desc{font-size:12.5px; color:var(--ink-dim); margin-top:6px;}
  .cab .cab-dna{font-size:11px; color:var(--neon); margin-top:10px; letter-spacing:.5px;}

  .tag{display:inline-block; font-size:9px; letter-spacing:1px; font-weight:700; padding:2px 6px; border-radius:3px; text-transform:uppercase;}
  .tag.mvp{background:var(--neon-5); color:#04120a;}
  .tag.p2{background:var(--neon-3); color:#1a1400;}
  .tag.soon{background:#2a3160; color:var(--ink-dim);}

  /* ---- Forms ---- */
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px 18px; margin:12px 0;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--neon-3);}
  .field input, .field select{
    font-family:var(--mono); font-size:14px; color:var(--ink);
    background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:9px 11px;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--neon); box-shadow:0 0 10px rgba(22,242,200,0.2);}
  .field input[type=color]{height:42px; padding:3px; cursor:pointer;}
  .field .hint{font-size:11px; color:var(--ink-dim);}
  .field.invalid input{border-color:var(--danger);}
  .field.invalid .hint{color:var(--danger);}

  /* ---- Attribute radar / bars ---- */
  .dna-layout{display:grid; grid-template-columns:300px 1fr; gap:24px; align-items:start;}
  .radar-wrap{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .attr-bars{display:flex; flex-direction:column; gap:10px;}
  .attr-row{display:grid; grid-template-columns:96px 1fr 42px; align-items:center; gap:10px; font-size:12px;}
  .attr-row .lbl{text-transform:uppercase; letter-spacing:1px; color:var(--ink-dim);}
  .attr-row .track{height:12px; background:var(--panel-2); border:1px solid var(--line); border-radius:6px; overflow:hidden;}
  .attr-row .fill{height:100%; background:linear-gradient(90deg, var(--neon-4), var(--neon)); border-radius:6px; transition:width .6s ease;}
  .attr-row .val{text-align:right; color:var(--neon); font-family:var(--pixel);}

  .stat-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin:14px 0;}
  .stat-card{background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:14px; text-align:center;}
  .stat-card .k{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-dim);}
  .stat-card .v{font-family:var(--pixel); font-size:26px; color:var(--neon); margin-top:4px;}
  .stat-card .v.gold{color:var(--neon-3);}

  /* rank badge */
  .rank-badge{
    display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:4px;
    font-family:var(--pixel); letter-spacing:2px; text-transform:uppercase; font-size:14px;
    border:1px solid var(--neon-3); color:var(--neon-3); background:rgba(255,210,61,0.08);
    box-shadow:0 0 14px rgba(255,210,61,0.2);
  }

  /* ============================================================
     TOOL / GAME SURFACES
     ============================================================ */
  .stage{
    background:#05070f; border:1px solid var(--line); border-radius:8px;
    min-height:320px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px; user-select:none; cursor:pointer; position:relative; overflow:hidden;
    box-shadow:inset 0 0 40px rgba(124,92,255,0.10);
  }
  .stage.ready{background:radial-gradient(circle at center, rgba(22,242,200,0.12), #05070f 70%);}
  .stage .big{font-family:var(--pixel); font-size:clamp(28px,5vw,46px); color:#fff; letter-spacing:1px;}
  .stage .small{font-size:14px; color:var(--ink-dim); margin-top:10px; max-width:480px;}
  .stage.wait{background:linear-gradient(180deg,#3a2a00,#1a1400); }
  .stage.wait .big{color:var(--neon-3);}
  .stage.go{background:radial-gradient(circle at center, rgba(55,227,91,0.35), #04120a 75%);}
  .stage.go .big{color:var(--neon-5); text-shadow:0 0 30px rgba(55,227,91,0.8);}
  .stage.foul{background:radial-gradient(circle at center, rgba(255,77,109,0.30), #16060b 75%);}
  .stage.foul .big{color:var(--danger);}
  canvas.game{display:block; background:#04060e; border:1px solid var(--line); border-radius:8px; max-width:100%; cursor:crosshair;}

  .results{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:16px 0;}
  .result-tile{background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:14px; text-align:center;}
  .result-tile .k{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-dim);}
  .result-tile .v{font-family:var(--pixel); font-size:24px; color:var(--neon); margin-top:4px;}
  .grade-badge{
    font-family:var(--pixel); font-size:40px; width:74px; height:74px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; margin:0 auto;
  }
  .grade-S{background:rgba(255,210,61,0.15); color:var(--neon-3); border:2px solid var(--neon-3); box-shadow:0 0 22px rgba(255,210,61,0.4);}
  .grade-A{background:rgba(55,227,91,0.15); color:var(--neon-5); border:2px solid var(--neon-5);}
  .grade-B{background:rgba(22,242,200,0.15); color:var(--neon); border:2px solid var(--neon);}
  .grade-C{background:rgba(124,92,255,0.15); color:var(--neon-4); border:2px solid var(--neon-4);}
  .grade-F{background:rgba(255,77,109,0.15); color:var(--danger); border:2px solid var(--danger);}

  .controls-row{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0;}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:5px; overflow:hidden;}
  .seg button{
    font-family:var(--mono); font-size:12px; background:var(--panel-2); color:var(--ink-dim);
    border:none; padding:8px 14px; cursor:pointer; letter-spacing:1px; border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none;}
  .seg button.on{background:var(--neon); color:#04120a; font-weight:700;}

  /* ============================================================
     SHARE CARD MODAL
     ============================================================ */
  .modal-backdrop{
    position:fixed; inset:0; z-index:200; background:rgba(2,4,12,0.82);
    display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px);
  }
  .modal{
    background:var(--panel); border:1px solid var(--neon); border-radius:10px; padding:22px;
    max-width:520px; width:100%; box-shadow:0 0 40px rgba(22,242,200,0.25); position:relative;
  }
  .modal h3{font-family:var(--pixel); color:var(--neon); margin:0 0 14px; letter-spacing:1px;}
  .modal canvas{display:block; width:100%; max-width:440px; margin:0 auto 16px; border-radius:8px; border:1px solid var(--line);}
  .modal-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .modal-close{position:absolute; top:10px; right:14px; cursor:pointer; color:var(--ink-dim); font-size:20px; background:none; border:none;}
  .modal-close:hover{color:var(--danger);}

  /* ============================================================
     TOASTS (achievement unlocks)
     ============================================================ */
  #toast-stack{position:fixed; top:16px; right:16px; z-index:300; display:flex; flex-direction:column; gap:10px; max-width:320px;}
  .toast{
    background:var(--panel); border:1px solid var(--neon-3); border-left:4px solid var(--neon-3);
    border-radius:6px; padding:12px 14px; box-shadow:0 0 24px rgba(255,210,61,0.25);
    animation:slidein .3s ease, fadeout .4s ease 4.6s forwards;
  }
  .toast .t-title{font-family:var(--pixel); color:var(--neon-3); font-size:13px; letter-spacing:1px;}
  .toast .t-body{font-size:12.5px; color:var(--ink); margin-top:3px;}
  @keyframes slidein{from{transform:translateX(120%); opacity:0;}to{transform:translateX(0); opacity:1;}}
  @keyframes fadeout{to{opacity:0; transform:translateX(120%);}}

  /* achievements grid */
  .ach-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin:14px 0;}
  .ach{background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:12px; display:flex; gap:10px; align-items:flex-start;}
  .ach.locked{opacity:0.45;}
  .ach .a-icon{font-size:24px; line-height:1;}
  .ach .a-name{font-family:var(--pixel); font-size:12px; color:#fff;}
  .ach .a-desc{font-size:11px; color:var(--ink-dim); margin-top:2px;}
  .ach.unlocked{border-color:var(--neon-3); box-shadow:0 0 12px rgba(255,210,61,0.15);}

  footer{text-align:center; padding:36px 16px 10px; color:var(--ink-dim); font-size:12px; letter-spacing:1px;}
  footer .pl{color:var(--neon); font-family:var(--pixel); letter-spacing:2px;}

  .blink{animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0.2;}}

  @media(max-width:900px){
    .layout{grid-template-columns:1fr;}
    nav.rail{position:static;}
    .dna-layout{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="crt-overlay"></div>

<div class="frame">
  <!-- ===================== MARQUEE ===================== -->
  <header class="marquee">
    <div class="brand-kicker">Playology Entertainment Presents</div>
    <div class="logo" id="logoHome"><span class="play">PLAY</span><span class="tools">TOOLS</span></div>
    <div class="subtitle">The Digital Arcade</div>
  </header>

  <!-- ===================== STATUS STRIP ===================== -->
  <div class="controls">
    <div class="score-strip" id="scoreStrip">
      GAMER DNA <span class="sep">·</span> CLASS <b id="ssClass">UNRANKED</b>
      <span class="sep">·</span> SCORE <b id="ssScore">0000000</b>
      <span class="sep">·</span> RANK <b id="ssRank">NEWBIE</b>
    </div>
    <div class="controls-actions">
      <button class="btn" id="dnaBtn">◈ Gamer DNA</button>
      <button class="btn ghost" id="crtToggle">Reduce CRT FX</button>
    </div>
  </div>

  <!-- ===================== APP LAYOUT ===================== -->
  <div class="layout">
    <nav class="rail" id="rail"><!-- built by JS --></nav>
    <main class="screen" id="screen"><!-- views mount here --></main>
  </div>

  <footer>
    <div>◈ ◈ ◈</div>
    <p><span class="pl">PLAYOLOGY ENTERTAINMENT</span> · PlayTools · The Digital Arcade</p>
    <p class="muted">Self-contained · No accounts · Your Gamer DNA lives only in this browser.</p>
  </footer>
</div>

<div id="toast-stack"></div>
<div id="modal-root"></div>

<script>
"use strict";
/* ============================================================================
   PLAYTOOLS APPLICATION
   Organized as small namespaced modules inside one IIFE.
     Store        - GamerDNA state + localStorage persistence
     Attr         - attribute engine (deltas, score, rank, class)
     Ach          - achievement engine
     ShareCard    - canvas share-card renderer + modal
     Router       - hash routing + lazy view mount/unmount
     Views        - home, dna hub, reflex lab cabinets
     UI           - shell wiring (status strip, rail, CRT, theme)
   ============================================================================ */
(function(){

/* ============================================================================
   STORE — GamerDNA global state
   ============================================================================ */
const Store = (function(){
  const KEY = 'playtools.gamerdna.v1';
  const PREF_KEY = 'playtools.prefs.v1';

  const ATTRS = ['reflex','precision','speed','focus','consistency','control','strategy'];

  function defaultDNA(){
    return {
      version: 1,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      profile: {
        gamerTag: '', url: '', dob: '',
        city: '', state: '', country: '',
        accent: '#16f2c8', car: '', character: '',
        contacts: { discord:'', email:'', phone:'' },
        socials: { twitch:'', youtube:'', x:'', tiktok:'', instagram:'' }
      },
      attributes: { reflex:0, precision:0, speed:0, focus:0, consistency:0, control:0, strategy:0 },
      toolsCompleted: 0,
      runs: 0,                 // total scored runs (any tool)
      arcadePoints: 0,         // points accumulated across arcade cabinets
      bests: {},               // toolId -> best metric object
      counters: {},            // misc counters used by achievements (e.g. nat20s, platformSetups)
      achievements: [],        // unlocked achievement ids
      calibration: null        // measured system latency t_link (ms)
    };
  }

  let dna = load();
  let prefs = loadPrefs();
  const listeners = [];

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return defaultDNA();
      const parsed = JSON.parse(raw);
      return Object.assign(defaultDNA(), parsed, {
        profile: Object.assign(defaultDNA().profile, parsed.profile||{}),
        attributes: Object.assign(defaultDNA().attributes, parsed.attributes||{}),
        bests: parsed.bests||{}, counters: parsed.counters||{}, achievements: parsed.achievements||[]
      });
    }catch(e){ console.warn('[PlayTools] corrupt save, resetting', e); return defaultDNA(); }
  }
  function loadPrefs(){
    try{ return Object.assign({reduceCrt:false}, JSON.parse(localStorage.getItem(PREF_KEY)||'{}')); }
    catch(e){ return {reduceCrt:false}; }
  }
  function save(){
    dna.updatedAt = Date.now();
    try{ localStorage.setItem(KEY, JSON.stringify(dna)); }catch(e){ console.warn('save failed', e); }
    emit();
  }
  function savePrefs(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); }catch(e){} }

  function emit(){ listeners.forEach(fn=>{ try{ fn(dna); }catch(e){ console.error(e); } }); }
  function subscribe(fn){ listeners.push(fn); return ()=>{ const i=listeners.indexOf(fn); if(i>=0) listeners.splice(i,1); }; }

  return {
    ATTRS,
    get(){ return dna; },
    getPrefs(){ return prefs; },
    setPref(k,v){ prefs[k]=v; savePrefs(); },
    save, subscribe,
    reset(){ dna = defaultDNA(); save(); },
    update(mut){ mut(dna); save(); }
  };
})();

/* ============================================================================
   ATTR — attribute engine: deltas, gamer score, rank, class (DD §3.1.3-3.1.4)
   ============================================================================ */
const Attr = (function(){
  // Rank tiers — name + min gamer-score threshold + neon badge color
  const RANKS = [
    { name:'Newbie',      min:0,     color:'#9aa3d4' },
    { name:'Rookie',      min:1000,  color:'#37e35b' },
    { name:'Pro',         min:3000,  color:'#16f2c8' },
    { name:'Veteran',     min:6000,  color:'#7c5cff' },
    { name:'Elite',       min:10000, color:'#ff3df0' },
    { name:'Master',      min:16000, color:'#ffd23d' },
    { name:'Legend',      min:24000, color:'#ff9f1c' },
    { name:'Arcade God',  min:35000, color:'#ff4d6d' }
  ];

  // Apply a weighted, performance-scaled delta vector to the 7 attributes.
  //   base: { reflex:12, focus:4, ... }  — max delta for a perfect run
  //   quality: 0..1 performance score for this run
  //   A_new = min(100, A_old + base * quality)            (DD §3.1.3)
  function applyVector(base, quality){
    quality = Math.max(0, Math.min(1, quality==null ? 1 : quality));
    Store.update(d=>{
      Object.keys(base).forEach(k=>{
        if(d.attributes[k]==null) return;
        d.attributes[k] = Math.max(0, Math.min(100, d.attributes[k] + base[k]*quality));
      });
    });
  }

  function gamerScore(d){
    d = d || Store.get();
    const a = d.attributes;
    const sum = Store.ATTRS.reduce((s,k)=>s+(a[k]||0),0);   // 0..700
    const attrAvg = sum/Store.ATTRS.length;                  // 0..100
    return Math.round(attrAvg*120 + d.toolsCompleted*120 + d.achievements.length*250 + d.arcadePoints);
  }

  function rankFor(score){
    let r = RANKS[0];
    for(const t of RANKS){ if(score>=t.min) r=t; }
    return r;
  }
  function nextRank(score){ return RANKS.find(t=>t.min>score) || null; }

  // Dynamic class allocation (DD §3.1.3). Evaluated top-down; first match wins.
  function classFor(d){
    d = d || Store.get();
    const a = d.attributes;
    if(d.runs < 2) return 'Unranked';
    const rules = [
      [a.reflex>=90 && a.precision>=85 && a.focus>=75, 'Arena Duelist'],
      [a.precision>=95 && a.control>=90,               'Sharpshooter'],
      [a.speed>=92 && a.consistency>=85,               'Speedrunner'],
      [a.reflex>=85 && a.focus>=80,                    'Reaction Master'],
      [a.precision>=80 && a.control>=70,               'Precision Hunter'],
      [a.strategy>=75 && a.consistency>=70,            'Tactical Commander'],
      [a.control>=80,                                  'Controller Wizard'],
      [a.consistency>=80,                              'Retro Veteran']
    ];
    for(const [cond,name] of rules){ if(cond) return name; }
    // Fallback: name by dominant attribute
    const dom = Store.ATTRS.reduce((m,k)=> (a[k]>a[m]?k:m), 'reflex');
    const map = { reflex:'Reaction Rookie', precision:'Steady Hand', speed:'Quickdraw',
                  focus:'Zen Player', consistency:'Metronome', control:'Smooth Operator', strategy:'Field Tactician' };
    return map[dom] || 'Arcade Champion';
  }

  return { RANKS, applyVector, gamerScore, rankFor, nextRank, classFor };
})();

/* ============================================================================
   ACH — achievement engine (DD §5.2)
   ============================================================================ */
const Ach = (function(){
  // Each definition: id, name, icon, desc, test(dna, ctx) -> bool
  const DEFS = [
    { id:'first_victory', name:'First Victory', icon:'🏆', desc:'Complete your first scored tool.',
      test:(d)=> d.toolsCompleted>=1 },
    { id:'reaction_master', name:'Reaction Master', icon:'⚡', desc:'Land an S-grade reaction time.',
      test:(d,c)=> c && c.tool==='reaction' && c.grade==='S' },
    { id:'precision_hunter', name:'Precision Hunter', icon:'🎯', desc:'Hit ≥98% accuracy on Precision Click.',
      test:(d,c)=> c && c.tool==='precision' && c.accuracy>=98 },
    { id:'speed_demon', name:'Speed Demon', icon:'🔥', desc:'Reach ≥12 CPS on the click test.',
      test:(d,c)=> c && c.tool==='cps' && c.cps>=12 },
    { id:'arcade_champion', name:'Arcade Champion', icon:'👑', desc:'Earn a 10,000 Gamer Score.',
      test:(d)=> Attr.gamerScore(d)>=10000 },
    { id:'completionist', name:'Completionist', icon:'💯', desc:'Unlock every other achievement.',
      test:(d)=> DEFS.filter(x=>x.id!=='completionist').every(x=> d.achievements.includes(x.id)) }
  ];

  // Evaluate all defs; unlock newly-satisfied ones; toast + return list of new unlocks.
  function evaluate(ctx){
    const d = Store.get();
    const newly = [];
    // two passes so completionist can react to others unlocked this tick
    for(let pass=0; pass<2; pass++){
      DEFS.forEach(def=>{
        if(d.achievements.includes(def.id)) return;
        let ok=false; try{ ok = def.test(d, ctx); }catch(e){}
        if(ok){ d.achievements.push(def.id); newly.push(def); }
      });
    }
    if(newly.length){ Store.save(); newly.forEach(def=> UI.toast('Achievement Unlocked', def.icon+' '+def.name)); }
    return newly;
  }
  function byId(id){ return DEFS.find(d=>d.id===id); }
  return { DEFS, evaluate, byId };
})();

/* ============================================================================
   SHARECARD — canvas renderer + modal (DD §5.1)
   ============================================================================ */
const ShareCard = (function(){
  const W=440, H=560;

  // data: { lab, tool, glyph, metric:[{k,v}], grade, designation, badge }
  function draw(canvas, data){
    const ctx = canvas.getContext('2d');
    const accent = Store.get().profile.accent || '#16f2c8';
    const tag = Store.get().profile.gamerTag || 'PLAYER ONE';
    canvas.width=W; canvas.height=H;

    // background
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0c1024'); g.addColorStop(1,'#05070f');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // grid
    ctx.strokeStyle='rgba(124,92,255,0.12)'; ctx.lineWidth=1;
    for(let x=0;x<W;x+=28){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(let y=0;y<H;y+=28){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    // border
    ctx.strokeStyle=accent; ctx.lineWidth=3; ctx.strokeRect(8,8,W-16,H-16);

    function center(text,y,font,color,glow){
      ctx.font=font; ctx.fillStyle=color; ctx.textAlign='center';
      if(glow){ ctx.shadowColor=color; ctx.shadowBlur=glow; } else ctx.shadowBlur=0;
      ctx.fillText(text, W/2, y); ctx.shadowBlur=0;
    }

    center('PLAYTOOLS', 48, '700 13px monospace', '#ffd23d', 8);
    center((data.lab||'ARCADE')+' · '+(data.tool||''), 70, '11px monospace', '#9aa3d4');

    // glyph
    center(data.glyph||'🕹️', 160, '90px sans-serif', '#fff', 0);

    // grade badge
    if(data.grade){
      ctx.fillStyle=accent; ctx.shadowColor=accent; ctx.shadowBlur=18;
      ctx.font='800 64px sans-serif'; ctx.textAlign='center';
      ctx.fillText('GRADE '+data.grade, W/2, 250); ctx.shadowBlur=0;
    }

    // metrics
    let y = data.grade ? 300 : 270;
    ctx.textAlign='left';
    (data.metric||[]).forEach(m=>{
      ctx.font='12px monospace'; ctx.fillStyle='#9aa3d4';
      ctx.fillText(String(m.k).toUpperCase(), 50, y);
      ctx.font='700 20px monospace'; ctx.fillStyle=accent; ctx.textAlign='right';
      ctx.fillText(String(m.v), W-50, y);
      ctx.textAlign='left'; y+=38;
    });

    // designation
    if(data.designation){
      y+=6;
      ctx.font='12px monospace'; ctx.fillStyle='#9aa3d4'; ctx.textAlign='center';
      ctx.fillText('DESIGNATION', W/2, y); y+=24;
      ctx.font='700 18px sans-serif'; ctx.fillStyle='#ff3df0'; ctx.shadowColor='#ff3df0'; ctx.shadowBlur=10;
      ctx.fillText(data.designation, W/2, y); ctx.shadowBlur=0; y+=10;
    }

    // badge strip
    if(data.badge){
      ctx.fillStyle='rgba(255,210,61,0.12)'; ctx.fillRect(30, H-128, W-60, 36);
      ctx.strokeStyle='#ffd23d'; ctx.lineWidth=1; ctx.strokeRect(30, H-128, W-60, 36);
      ctx.font='13px monospace'; ctx.fillStyle='#ffd23d'; ctx.textAlign='center';
      ctx.fillText('★ '+data.badge, W/2, H-104);
    }

    // footer — player + url
    center('@'+tag, H-64, '700 15px sans-serif', accent, 6);
    center('playology · playtools', H-40, '11px monospace', '#9aa3d4');
  }

  // open a modal showing the rendered card with share/download actions
  function open(data){
    const root = document.getElementById('modal-root');
    root.innerHTML='';
    const backdrop = el('div',{class:'modal-backdrop'});
    const modal = el('div',{class:'modal'});
    const close = el('button',{class:'modal-close', html:'✕'});
    const h3 = el('h3',{html:'▶ SHARE CARD'});
    const canvas = document.createElement('canvas');
    const actions = el('div',{class:'modal-actions'});
    const dl = el('button',{class:'btn primary', html:'⬇ Download PNG'});
    const sh = el('button',{class:'btn', html:'↗ Share'});
    const cl = el('button',{class:'btn ghost', html:'Close'});

    actions.append(dl, sh, cl);
    modal.append(close, h3, canvas, actions);
    backdrop.append(modal); root.append(backdrop);
    draw(canvas, data);

    function dismiss(){ root.innerHTML=''; }
    close.onclick = dismiss; cl.onclick = dismiss;
    backdrop.onclick = e=>{ if(e.target===backdrop) dismiss(); };

    const fname = 'playtools_'+(data.tool||'card').toLowerCase().replace(/\s+/g,'-')+'.png';
    dl.onclick = ()=>{
      const a=document.createElement('a'); a.download=fname; a.href=canvas.toDataURL('image/png'); a.click();
    };
    const shareText = buildText(data);
    sh.onclick = async ()=>{
      try{
        const blob = await new Promise(r=> canvas.toBlob(r,'image/png'));
        const file = new File([blob], fname, {type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({ files:[file], title:'PlayTools', text:shareText });
        } else if(navigator.share){
          await navigator.share({ title:'PlayTools', text:shareText });
        } else {
          await navigator.clipboard.writeText(shareText);
          UI.toast('Copied','Share text copied to clipboard');
        }
      }catch(e){ /* user cancelled */ }
    };
  }

  function buildText(data){
    const tag = Store.get().profile.gamerTag || 'I';
    const m = (data.metric&&data.metric[0]) ? (data.metric[0].k+' '+data.metric[0].v) : '';
    return `${tag} just scored ${data.grade?('Grade '+data.grade+' '):''}${m} on PlayTools ${data.tool||''} — beat me! 🕹️ #PlayTools`;
  }

  return { draw, open };
})();

/* ============================================================================
   small DOM helper
   ============================================================================ */
function el(tag, opts){
  const n = document.createElement(tag); opts = opts||{};
  Object.keys(opts).forEach(k=>{
    if(k==='class') n.className=opts[k];
    else if(k==='html') n.innerHTML=opts[k];
    else if(k==='text') n.textContent=opts[k];
    else if(k==='style') n.setAttribute('style',opts[k]);
    else if(k.startsWith('on') && typeof opts[k]==='function') n.addEventListener(k.slice(2), opts[k]);
    else n.setAttribute(k, opts[k]);
  });
  return n;
}

/* ============================================================================
   ROUTER — hash routing + lazy view mount/unmount (DD §2.2)
   ============================================================================ */
const Router = (function(){
  const screen = document.getElementById('screen');
  let current = null;   // { teardown }
  const routes = {};    // path -> mount(container) -> teardownFn|undefined

  function add(path, mount){ routes[path]=mount; }

  function resolve(){
    const hash = location.hash || '#/';
    // exact match, else prefix fallback to home
    const mount = routes[hash] || routes['#/'];
    if(current && current.teardown){ try{ current.teardown(); }catch(e){ console.error(e); } }
    screen.innerHTML='';
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
    let teardown=null;
    try{ teardown = mount(screen); }catch(e){ console.error('view error', e); screen.innerHTML='<div class="panel"><h1 class="title">Glitch in the Matrix</h1><p class="muted">This cabinet failed to load.</p></div>'; }
    current = { teardown: typeof teardown==='function' ? teardown : null };
    UI.highlightRail(hash);
  }

  function start(){ window.addEventListener('hashchange', resolve); resolve(); }
  function go(hash){ if(location.hash===hash) resolve(); else location.hash=hash; }
  return { add, start, go };
})();

    ag.append(a);

  c.append(panel);
};

// 7-axis radar chart
function drawRadar(canvas, attrs){
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2, R=Math.min(W,H)/2-34;
  const keys = Store.ATTRS, N=keys.length;
  const accent = Store.get().profile.accent || '#16f2c8';
  ctx.clearRect(0,0,W,H);
  function pt(i, r){ const ang=-Math.PI/2 + i*2*Math.PI/N; return [cx+Math.cos(ang)*r, cy+Math.sin(ang)*r]; }
  // rings
  ctx.strokeStyle='rgba(124,92,255,0.25)'; ctx.lineWidth=1;
  for(let ring=1; ring<=4; ring++){
    ctx.beginPath();
    for(let i=0;i<=N;i++){ const [x,y]=pt(i%N, R*ring/4); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.stroke();
  }
  // spokes + labels
  ctx.fillStyle='#9aa3d4'; ctx.font='9px monospace'; ctx.textAlign='center';
  for(let i=0;i<N;i++){
    const [x,y]=pt(i,R); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
    const [lx,ly]=pt(i,R+16); ctx.fillText(keys[i].slice(0,4).toUpperCase(), lx, ly+3);
  }
  // data polygon
  ctx.beginPath();
  for(let i=0;i<=N;i++){ const k=keys[i%N]; const r=R*Math.max(0,Math.min(100,attrs[k]))/100; const [x,y]=pt(i%N,r); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath();
  ctx.fillStyle=hexA(accent,0.25); ctx.strokeStyle=accent; ctx.lineWidth=2; ctx.shadowColor=accent; ctx.shadowBlur=10;
  ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
  // vertices
  ctx.fillStyle=accent;
  for(let i=0;i<N;i++){ const k=keys[i]; const r=R*Math.max(0,Math.min(100,attrs[k]))/100; const [x,y]=pt(i,r); ctx.beginPath(); ctx.arc(x,y,3,0,7); ctx.fill(); }
}
function hexA(hex,a){
  const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex)||['','16','f2','c8'];
  return `rgba(${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)},${a})`;
}

/* ---- 4.1.1 Latency Calibration ---- */
Views.calibration = function(c){
  const cab = getCab('calibration');
  const panel = toolShell(c, cab);
  const samples = [];
  const TARGET = 3;
  const stage = el('div',{class:'stage ready'});
  const info = el('p',{class:'muted'});
  const result = el('div',{});
  panel.append(stage, info, result);

  function render(){
    if(samples.length<TARGET){
      stage.className='stage ready';
      stage.innerHTML = `<div class="big">CLICK NOW</div><div class="small">Click the panel as fast as you can, ${TARGET} times in a row. We measure your system + input latency baseline (t_link) to subtract from scored runs.</div>`;
      info.innerHTML = `Samples: <strong>${samples.length}/${TARGET}</strong>`;
    } else {
      const avg = samples.reduce((a,b)=>a+b,0)/samples.length;
      const tlink = Math.round(avg);
      Store.update(d=> d.calibration = tlink);
      stage.className='stage go';
      stage.innerHTML = `<div class="big">CALIBRATED</div><div class="small">Baseline latency locked in.</div>`;
      info.innerHTML='';
      result.innerHTML='';
      const r = el('div',{class:'results'});
      r.innerHTML = `<div class="result-tile"><div class="k">System Latency (t_link)</div><div class="v">${tlink} ms</div></div>
        <div class="result-tile"><div class="k">Samples</div><div class="v">${samples.map(s=>Math.round(s)).join(' · ')}</div></div>`;
      result.append(r);
      const again = el('button',{class:'btn', html:'↻ Recalibrate'});
      const next = el('button',{class:'btn primary', html:'→ Reaction Time'});
      const row = el('div',{class:'controls-row'}); row.append(again,next); result.append(row);
      again.onclick = ()=>{ samples.length=0; lastT=0; render(); };
      next.onclick = ()=> Router.go('#/reflex/reaction');
    }
  }
  let lastT = 0;
  function onClick(){
    if(samples.length>=TARGET) return;
    const now = performance.now();
    if(lastT){ samples.push(now-lastT); }
    lastT = now;
    if(samples.length>=TARGET){ render(); } else { render(); }
  }
  stage.addEventListener('pointerdown', onClick);
  // first click only starts the clock; subsequent intervals are samples
  render();
  info.insertAdjacentHTML('afterend','<p class="muted" style="font-size:11px">Tip: the first click starts the timer; the next clicks are measured. A lower baseline means snappier hardware.</p>');
  return ()=>{};
};

/* ---- 4.1.2 Reaction Time ---- */
Views.reaction = function(c){
  const cab = getCab('reaction');
  const panel = toolShell(c, cab);
  const tlink = Store.get().calibration || 0;
  panel.append(el('p',{class:'muted', style:'font-size:12px',
    html: tlink ? `Calibrated baseline t_link = <strong>${tlink}ms</strong> (subtracted from your raw time).`
                : `<a href="#/reflex/calibration">Calibrate latency first</a> for the most accurate score (optional).`}));

  const stage = el('div',{class:'stage'});
  const result = el('div',{});
  panel.append(stage, result);

  // state: idle -> waiting (amber) -> go (green, t0) -> captured
  let state='idle', t0=0, timer=null;
  function setIdle(){
    state='idle'; clearTimeout(timer);
    stage.className='stage ready';
    stage.innerHTML = `<div class="big">CLICK TO START</div><div class="small">When the screen turns <span style="color:var(--neon-5)">NEON GREEN</span>, click as fast as you can. Clicking early is a FALSE START.</div>`;
  }
  function setWaiting(){
    state='waiting';
    stage.className='stage wait';
    stage.innerHTML = `<div class="big">WAIT FOR NEON GREEN…</div><div class="small">Steady…</div>`;
    const delay = 2000 + Math.random()*4500; // 2000–6500ms
    timer = setTimeout(setGo, delay);
  }
  function setGo(){
    state='go'; t0=performance.now();
    stage.className='stage go';
    stage.innerHTML = `<div class="big">CLICK!</div>`;
  }
  function foul(){
    state='idle'; clearTimeout(timer);
    stage.className='stage foul';
    stage.innerHTML = `<div class="big">FALSE START · FOUL</div><div class="small">Too soon! Click to try again.</div>`;
  }
  function capture(){
    const raw = performance.now()-t0;
    const dt = Math.max(1, Math.round(raw - tlink));
    state='done';
    finish(dt);
  }
  function onDown(){
    if(state==='idle' || state==='done'){ setWaiting(); }
    else if(state==='waiting'){ foul(); }
    else if(state==='go'){ capture(); }
  }
  stage.addEventListener('pointerdown', onDown);

  function grade(ms){ return ms<180?'S':ms<220?'A':ms<260?'B':ms<320?'C':'F'; }
  // percentile beaten via Gaussian benchmark (mean 273ms, sd 60ms); faster = better
  function percentile(ms){
    const z=(ms-273)/60; const cdf=0.5*(1+erf(z/Math.SQRT2));
    return Math.max(1, Math.min(99, Math.round((1-cdf)*100)));
  }

  function finish(dt){
    const g = grade(dt), pct=percentile(dt);
    stage.className='stage go';
    stage.innerHTML = `<div class="big">${dt} ms</div><div class="small">Click to go again</div>`;
    // DNA: quality scales between 320ms (0) and 150ms (1)
    const quality = clamp01((320-dt)/(320-150));
    recordRun('reaction', {best:'min', value:dt});
    Attr.applyVector({reflex:12, focus:4}, quality);
    Ach.evaluate({tool:'reaction', grade:g, dt});

    result.innerHTML='';
    const r = el('div',{class:'results'});
    r.innerHTML = `<div class="result-tile"><div class="k">Reaction</div><div class="v">${dt} ms</div></div>
      <div class="result-tile"><div class="k">Grade</div><div class="grade-badge grade-${g}">${g}</div></div>
      <div class="result-tile"><div class="k">Faster than</div><div class="v">${pct}%</div></div>
      <div class="result-tile"><div class="k">Best</div><div class="v">${Store.get().bests.reaction.value} ms</div></div>`;
    result.append(r);
    result.append(shareRow({
      lab:'REFLEX LAB', tool:'Reaction Time', glyph:'⚡',
      grade:g, metric:[{k:'Reaction', v:dt+' ms'}, {k:'Faster than', v:pct+'%'}],
      designation: g==='S'?'Reaction Master': g==='A'?'Sharp Reflexes':'Quick Hands',
      badge: g==='S'?'Lightning Reflexes':null
    }));
    state='done';
  }
  setIdle();
  return ()=>{ clearTimeout(timer); };
};

/* ---- 4.1.3 CPS Test ---- */
Views.cps = function(c){
  const cab = getCab('cps');
  const panel = toolShell(c, cab);
  let duration=5; // seconds
  const seg = el('div',{class:'seg'});
  [1,5,10,20].forEach(s=>{
    const b=el('button',{html:s+'s'}); if(s===duration) b.className='on';
    b.onclick=()=>{ if(running) return; duration=s; [...seg.children].forEach(x=>x.className=''); b.className='on'; reset(); };
    seg.append(b);
  });
  const row = el('div',{class:'controls-row'}); row.append(el('span',{class:'muted', style:'align-self:center', html:'Duration:'}), seg);
  panel.append(row);

  const stage = el('div',{class:'stage ready'});
  const result = el('div',{});
  panel.append(stage, result);

  let running=false, clicks=[], startT=0, timer=null;
  function reset(){
    running=false; clicks=[]; clearTimeout(timer);
    stage.className='stage ready';
    stage.innerHTML = `<div class="big">CLICK TO START</div><div class="small">First click starts a ${duration}s timer. Click as fast as you can until time runs out.</div>`;
    result.innerHTML='';
  }
  function onDown(){
    if(!running){
      running=true; startT=performance.now(); clicks=[startT];
      stage.className='stage go'; tick();
      timer=setTimeout(end, duration*1000);
    } else {
      clicks.push(performance.now());
    }
  }
  function tick(){
    if(!running) return;
    const left = Math.max(0, duration - (performance.now()-startT)/1000);
    stage.innerHTML = `<div class="big">${clicks.length-1}</div><div class="small">${left.toFixed(1)}s left — keep clicking!</div>`;
    if(running) requestAnimationFrame(tick);
  }
  function end(){
    running=false;
    const total = clicks.length-1; // first click was the starter
    const cps = total/duration;
    // consistency = inverse coefficient of variation of inter-click deltas
    const deltas=[]; for(let i=1;i<clicks.length;i++) deltas.push(clicks[i]-clicks[i-1]);
    let consistency=0;
    if(deltas.length>1){
      const mean=deltas.reduce((a,b)=>a+b,0)/deltas.length;
      const variance=deltas.reduce((a,b)=>a+(b-mean)*(b-mean),0)/deltas.length;
      const cv=Math.sqrt(variance)/mean;
      consistency=Math.max(0, Math.min(100, Math.round((1-cv)*100)));
    }
    stage.className='stage go';
    stage.innerHTML = `<div class="big">${cps.toFixed(2)} CPS</div><div class="small">Click below to try again</div>`;

    const quality = clamp01(cps/14); // 14 CPS ≈ perfect
    recordRun('cps', {best:'max', value:+cps.toFixed(2)});
    Attr.applyVector({speed:15, consistency:5}, quality);
    Ach.evaluate({tool:'cps', cps});

    result.innerHTML='';
    const r=el('div',{class:'results'});
    r.innerHTML = `<div class="result-tile"><div class="k">Total Clicks</div><div class="v">${total}</div></div>
      <div class="result-tile"><div class="k">CPS</div><div class="v">${cps.toFixed(2)}</div></div>
      <div class="result-tile"><div class="k">Consistency</div><div class="v">${consistency}%</div></div>
      <div class="result-tile"><div class="k">Best CPS</div><div class="v">${Store.get().bests.cps.value}</div></div>`;
    result.append(r);
    result.append(shareRow({
      lab:'REFLEX LAB', tool:'CPS Test', glyph:'🖱️',
      metric:[{k:'CPS', v:cps.toFixed(2)},{k:'Clicks', v:total},{k:'Consistency', v:consistency+'%'}],
      designation: cps>=12?'Speed Demon': cps>=8?'Rapid Fire':'Click Cadet',
      badge: cps>=12?'Speed Demon':null
    }));
  }
  stage.addEventListener('pointerdown', onDown);
  reset();
  return ()=>{ clearTimeout(timer); running=false; };
};

/* ---- 4.1.4 Precision Click ---- */
Views.precision = function(c){
  const cab = getCab('precision');
  const panel = toolShell(c, cab);
  const SPAWNS=30, LIFE=1200, RADIUS=12; // 24px diameter
  const W=800, H=500;
  const canvas = el('canvas',{class:'game'}); canvas.width=W; canvas.height=H;
  const wrap = el('div',{style:'overflow-x:auto'}); wrap.append(canvas);
  const info = el('p',{class:'muted'});
  const result = el('div',{});
  const startBtn = el('button',{class:'btn primary', html:'▶ Start (30 targets)'});
  const startRow = el('div',{class:'controls-row'}); startRow.append(startBtn);
  panel.append(startRow, info, wrap, result);

  const ctx = canvas.getContext('2d');
  let running=false, spawnIdx=0, hits=0, misses=0, target=null, spawnTime=0, raf=null;
  let distErrors=[], acqTimes=[];

  function bg(){
    ctx.fillStyle='#04060e'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(124,92,255,0.10)';
    for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  }
  function spawn(){
    if(spawnIdx>=SPAWNS){ return end(); }
    spawnIdx++;
    const m=RADIUS+10;
    target={ x:m+Math.random()*(W-2*m), y:m+Math.random()*(H-2*m) };
    spawnTime=performance.now();
  }
  function loop(){
    if(!running) return;
    bg();
    if(target){
      const age=performance.now()-spawnTime;
      if(age>LIFE){ misses++; spawn(); }
      else {
        const accent=Store.get().profile.accent||'#16f2c8';
        const pulse=1-age/LIFE;
        ctx.beginPath(); ctx.arc(target.x,target.y,RADIUS+6*pulse,0,7);
        ctx.fillStyle=hexA(accent,0.18); ctx.fill();
        ctx.beginPath(); ctx.arc(target.x,target.y,RADIUS,0,7);
        ctx.fillStyle=accent; ctx.shadowColor=accent; ctx.shadowBlur=14; ctx.fill(); ctx.shadowBlur=0;
        ctx.beginPath(); ctx.arc(target.x,target.y,3,0,7); ctx.fillStyle='#04060e'; ctx.fill();
      }
    }
    ctx.fillStyle='#9aa3d4'; ctx.font='13px monospace'; ctx.textAlign='left';
    ctx.fillText(`Target ${Math.min(spawnIdx,SPAWNS)}/${SPAWNS}   Hits ${hits}   Miss ${misses}`, 12, 22);
    raf=requestAnimationFrame(loop);
  }
  function onClick(e){
    if(!running || !target) return;
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)*(W/rect.width), y=(e.clientY-rect.top)*(H/rect.height);
    const dist=Math.hypot(x-target.x, y-target.y);
    if(dist<=RADIUS){
      hits++; distErrors.push(dist); acqTimes.push(performance.now()-spawnTime); spawn();
    } else { misses++; }
  }
  function start(){
    running=true; spawnIdx=0; hits=0; misses=0; distErrors=[]; acqTimes=[];
    startBtn.disabled=true; info.textContent='Click the neon targets before they vanish!';
    result.innerHTML=''; spawn(); loop();
  }
  function end(){
    running=false; cancelAnimationFrame(raf); startBtn.disabled=false; target=null; bg();
    ctx.fillStyle='#16f2c8'; ctx.font='700 26px sans-serif'; ctx.textAlign='center';
    ctx.fillText('RUN COMPLETE', W/2, H/2);
    const total=hits+misses;
    const accuracy = total? Math.round(hits/total*100) : 0;
    const avgDist = distErrors.length? distErrors.reduce((a,b)=>a+b,0)/distErrors.length : RADIUS;
    const avgAcq  = acqTimes.length? acqTimes.reduce((a,b)=>a+b,0)/acqTimes.length : LIFE;
    // precision rating: closeness to center + acquisition speed
    const centerScore = clamp01(1-avgDist/RADIUS);          // 1 = bullseye
    const speedScore  = clamp01(1-avgAcq/LIFE);             // 1 = instant
    const rating = Math.round((centerScore*0.6+speedScore*0.4)*100);

    const quality = clamp01(accuracy/100 * 0.7 + rating/100*0.3);
    recordRun('precision', {best:'max', value:accuracy});
    Attr.applyVector({precision:16, control:6}, quality);
    Ach.evaluate({tool:'precision', accuracy});

    info.textContent='';
    result.innerHTML='';
    const r=el('div',{class:'results'});
    r.innerHTML = `<div class="result-tile"><div class="k">Hits</div><div class="v">${hits}</div></div>
      <div class="result-tile"><div class="k">Misses</div><div class="v">${misses}</div></div>
      <div class="result-tile"><div class="k">Accuracy</div><div class="v">${accuracy}%</div></div>
      <div class="result-tile"><div class="k">Precision Rating</div><div class="v">${rating}</div></div>`;
    result.append(r);
    result.append(shareRow({
      lab:'REFLEX LAB', tool:'Precision Click', glyph:'🎯',
      metric:[{k:'Accuracy', v:accuracy+'%'},{k:'Hits', v:hits+'/'+total},{k:'Rating', v:rating}],
      designation: accuracy>=98?'Precision Hunter': accuracy>=85?'Marksman':'Spray & Pray',
      badge: accuracy>=98?'Precision Hunter':null
    }));
  }
  canvas.addEventListener('pointerdown', onClick);
  startBtn.onclick = start;
  bg(); ctx.fillStyle='#9aa3d4'; ctx.font='15px monospace'; ctx.textAlign='center';
  ctx.fillText('Press START — 30 targets, 1.2s each. Accuracy & speed feed Precision + Control.', W/2, H/2);
  return ()=>{ running=false; cancelAnimationFrame(raf); };
};

/* ============================================================================
   shared helpers for tool views
   ============================================================================ */
function clamp01(x){ return Math.max(0, Math.min(1, x)); }
function erf(x){ // Abramowitz-Stegun approximation
  const s=x<0?-1:1; x=Math.abs(x);
  const t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
  return s*y;
}
// record a run: bump tools/runs counters, track personal best
function recordRun(toolId, best){
  Store.update(d=>{
    d.runs++; d.toolsCompleted++;
    const cur=d.bests[toolId];
    if(!cur){ d.bests[toolId]={value:best.value, mode:best.best}; }
    else if(best.best==='min' && best.value<cur.value){ cur.value=best.value; }
    else if(best.best==='max' && best.value>cur.value){ cur.value=best.value; }
  });
  Ach.evaluate({tool:toolId});
}

    rail.querySelectorAll('a').forEach(a=> a.classList.toggle('active', a.getAttribute('data-route')===hash));

    const d=Store.get(), score=Attr.gamerScore(d), rank=Attr.rankFor(score);

  }

  function applyCrt(){
    const reduce=Store.getPrefs().reduceCrt;
    document.body.classList.toggle('no-crt', reduce);
    document.getElementById('crtToggle').textContent = reduce?'Enable CRT FX':'Reduce CRT FX';
  }

  function toast(title, body){
    const stack=document.getElementById('toast-stack');
    const t=el('div',{class:'toast'});
    t.innerHTML=`<div class="t-title">${title}</div><div class="t-body">${body}</div>`;
    stack.append(t);
    setTimeout(()=>{ t.remove(); }, 5200);
  }

  function init(){
    buildRail();
    applyAccent(Store.get().profile.accent);

    document.getElementById('crtToggle').onclick=()=>{ Store.setPref('reduceCrt', !Store.getPrefs().reduceCrt); applyCrt(); };
    document.getElementById('dnaBtn').onclick=()=> Router.go('#/dna');
    document.getElementById('logoHome').onclick=()=> Router.go('#/');
  }

  return { init, buildRail, highlightRail, refreshStrip, applyAccent, toast };
})();
